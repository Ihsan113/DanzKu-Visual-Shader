name: Build DanzKu V5.2.26 + Monitor V5.2.26

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  monitor-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
      - name: Install SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build Monitor APK
        working-directory: monitor
        run: gradle :app:assembleDebug --no-daemon
      - name: Verify APK
        run: |
          set -euxo pipefail
          test -s monitor/app/build/outputs/apk/debug/app-debug.apk
          file monitor/app/build/outputs/apk/debug/app-debug.apk
          sha256sum monitor/app/build/outputs/apk/debug/app-debug.apk
      - name: Upload Monitor APK
        uses: actions/upload-artifact@v4
        with:
          name: DanzKu-Monitor-V5.2.26-debug
          path: monitor/app/build/outputs/apk/debug/app-debug.apk

  shader-module:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
      - name: Install SDK components
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
      - name: Validate source and config
        run: python3 scripts/validate_source.py
      - name: Configure
        run: |
          cmake -S app -B build             -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake"             -DANDROID_ABI=arm64-v8a             -DANDROID_PLATFORM=android-29             -DCMAKE_BUILD_TYPE=Release
      - name: Build shader
        run: cmake --build build --config Release -j2
      - name: Package module
        run: |
          set -euxo pipefail
          SO_PATH="$(find build -type f -name 'libdanzku_shader.so' -print -quit)"
          test -n "$SO_PATH"
          rm -rf dist
          mkdir -p dist/danzku_visual_shader/zygisk dist/danzku_visual_shader/config
          cp "$SO_PATH" dist/danzku_visual_shader/zygisk/arm64-v8a.so
          cp module/module.prop dist/danzku_visual_shader/module.prop
          cp module/service.sh dist/danzku_visual_shader/service.sh
          cp module/uninstall.sh dist/danzku_visual_shader/uninstall.sh
          cp module/config/visual.conf dist/danzku_visual_shader/config/visual.conf
          cp module/config/media.conf dist/danzku_visual_shader/config/media.conf
          cp module/config/targets.conf dist/danzku_visual_shader/config/targets.conf
          chmod 0755 dist/danzku_visual_shader/service.sh dist/danzku_visual_shader/uninstall.sh
          cd dist
          zip -r DanzKu-Visual-Shader-v5.2.26-INSTALL.zip danzku_visual_shader
          unzip -t DanzKu-Visual-Shader-v5.2.26-INSTALL.zip
          sha256sum DanzKu-Visual-Shader-v5.2.26-INSTALL.zip
      - name: Upload shader ZIP
        uses: actions/upload-artifact@v4
        with:
          name: DanzKu-Visual-Shader-v5.2.26-install
          path: dist/DanzKu-Visual-Shader-v5.2.26-INSTALL.zip
