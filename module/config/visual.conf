# DanzKu Visual Shader V5.0 — Advanced Visual Reconstruction
# Preserves V2.7 adaptive detail, V2.8 temporal, V2.8.5 motion-aware,
# V2.9.1 material detail, V2.9.5 edge-aware, V3.0 reconstruction,
# V3.1 dynamic quality and V3.2 temporal detail recovery.
# Adds V3.3 reconstruction confidence, V3.5 neural-style reconstruction,
# V4.0 high-end reconstruction, V5.0 advanced visual reconstruction and
# V5.2.26 proofed full-surface output stage.
enabled=1
logging=1

# Resource/performance controls
# RAM optimization releases the temporal history buffer when temporal is OFF.
# It does not reduce visual quality while temporal processing is active.
ram_optimization=1
# FPS boost uses a low-overhead runtime mode (less config/report overhead).
# It does not alter shader quality parameters.
fps_boost=1
sharpen=0.18
clarity=0.08
reconstruction_output=1
visual_proof=1
visual_proof_bypass=0
temporal=1
temporal_strength=0.20
motion_aware=1
motion_threshold=0.020
motion_softness=0.100
material_detail=0.12
local_contrast=0.08
highlight_refine=0.06
shadow_refine=0.05
edge_aware=1
edge_strength=0.10
edge_threshold=0.012
edge_softness=0.080
reconstruction=1.0

# V3.1 Dynamic Quality
dynamic_quality=1
quality_min=0.65
quality_max=1.15

# V3.2 Temporal Detail Recovery
temporal_detail_recovery=1
recovery_strength=0.12
recovery_threshold=0.025

# V3.3 Reconstruction Confidence
reconstruction_confidence=1
confidence_strength=0.85
confidence_threshold=0.025
confidence_softness=0.080

# V3.5 Neural-Style Reconstruction
neural_style_reconstruction=1
neural_strength=0.10
structure_strength=0.35

# V4.0 High-End Reconstruction
high_end_reconstruction=1
high_end_strength=0.65

# V5.0 Advanced Visual Reconstruction
# Screen-space/temporal approximations only; no true ray tracing.
advanced_aa=1
aa_strength=0.22
shadow_enhancement=0.18
shadow_stability=0.22
contact_shadow=0.10
ao_enhancement=0.10
specular_enhancement=0.10
reflection_approximation=0.08
lighting_enhancement=0.08
effect_enhancement=0.10

# V5.0 Color Pop
# 1.00 = native saturation; 1.25 = visible pop; 1.50 = strong pop.
saturation=1.25
