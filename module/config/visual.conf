# DanzKu Visual Shader V5.3.0 — DLSS-like Additive Reconstruction Core
# Preserves V2.7 adaptive detail, V2.8 temporal, V2.8.5 motion-aware,
# V2.9.1 material detail, V2.9.5 edge-aware, V3.0 reconstruction,
# V3.1 dynamic quality and V3.2 temporal detail recovery.
# Adds V3.3 reconstruction confidence, V3.5 neural-style reconstruction,
# V4.0 high-end reconstruction, V5.0 advanced visual reconstruction,
# V5.2.26 proofed full-surface output stage, V9–V12 temporal reconstruction, and V5.3.0 additive DLSS-like compositing.
enabled=1
logging=1

# Stage 3 — True Supersampling (danzku_ss.cpp)
# Dedicated SS diagnosis: runtime reports also emit danzku_ss_diag_<pid>.log when logging=1.
# It records wrapper/thread/FBO/viewport evidence without changing the SS render path.
# true_supersampling=1 redirects the game's default framebuffer to a private FBO
# rendered at supersampling_scale times the EGL surface size, then downsamples it
# back before eglSwapBuffers. Runs independently of the reconstruction pipeline
# below, which still processes the (now downsampled) image afterward.
true_supersampling=1
supersampling_scale=1.25
supersampling_max_pixels=4200000

# Resource/performance controls
ram_optimization=1
fps_boost=1
sharpen=0.34
clarity=0.20
reconstruction_output=1
visual_proof=1
visual_proof_bypass=0
temporal=1
temporal_strength=0.20
motion_aware=1
motion_threshold=0.020
motion_softness=0.100
material_detail=0.28
local_contrast=0.20
highlight_refine=0.16
shadow_refine=0.14
edge_aware=1
edge_strength=0.24
edge_threshold=0.012
edge_softness=0.080
reconstruction=1.0

# V3.1 Dynamic Quality
dynamic_quality=1
quality_min=0.65
quality_max=1.15

# V3.2 Temporal Detail Recovery
temporal_detail_recovery=1
recovery_strength=0.12
recovery_threshold=0.025

# V3.3 Reconstruction Confidence
reconstruction_confidence=1
confidence_strength=0.85
confidence_threshold=0.025
confidence_softness=0.080

# V3.5 Neural-Style Reconstruction
neural_style_reconstruction=1
neural_strength=0.18
structure_strength=0.55

# V4.0 High-End Reconstruction
high_end_reconstruction=1
high_end_strength=0.78

# V5.0 Advanced Visual Reconstruction
advanced_aa=1
aa_strength=0.12
shadow_enhancement=0.28
shadow_stability=0.45
contact_shadow=0.30
ao_enhancement=0.28
specular_enhancement=0.28
reflection_approximation=0.22
lighting_enhancement=0.24
effect_enhancement=0.28
saturation=1.25

# V5.2.26 Visual Game Enhancements
vibrance=0.20
anisotropic_enhancement=4.0
frame_buffer_optimization=1
adaptive_texture_enhancement=0.28
hdr_enhancement=0.22
color_master=1
texture_master=1

# V6.0-V6.2 AI++ screen-space reconstruction (heuristic, not neural inference)
ai_reconstruction_v6=1
ai_motion_strength=0.55
ai_reactive_strength=0.35
ai_ghost_protection=0.55
ai_subpixel_strength=0.22
ai_frequency_detail=0.30
ai_edge_sharpen=0.24
ai_luma_chroma=0.18
ai_highlight_reconstruction=0.14
ai_shadow_recovery=0.16
ai_material_reconstruction=0.28
ai_dynamic_quality=1
ai_detail_budget=0.78
ai_motion_complexity=0.55

# V9 Integrated Temporal Reconstruction
# Screen-space proxy only: no game-owned depth/motion buffer is assumed.
v9_reconstruction=1
v9_reprojection=0.50
v9_depth_proxy=0.55
v9_history_clip=0.62
v9_responsive=0.38

# V10 Anti-shimmer / Temporal Stability Refinement
# Screen-space only: stabilizes history without requiring game motion/depth buffers.
v10_antishimmer=1
v10_shimmer_strength=0.62
v10_stability_threshold=0.018
v10_stability_softness=0.060
v10_edge_protection=0.75

# V11 Detail Preservation + Ghost Rejection Refinement
# Screen-space only: protects current-frame detail and rejects unstable history.
v11_detail_preservation=1
v11_ghost_rejection=0.68
v11_detail_threshold=0.018
v11_detail_softness=0.055
v11_color_clip=0.75

# V12 Motion Handling
# Screen-space motion proxy: adapts temporal history to local/camera motion without game motion vectors.
v12_motion_handling=1
v12_camera_motion=0.65
v12_motion_softness=0.12
v12_motion_threshold=0.025
v12_history_response=0.70
v12_motion_detail_preservation=0.86

# V5.3.0 — Additive compositing / DLSS-like reconstruction core
# All visual stages are additive or bounded; no feature is allowed to replace the
# accumulated spatial result. Temporal stages stabilize the result instead of erasing detail.
# Recommendation presets in the APK choose a device-aware baseline; native code adapts per frame.
