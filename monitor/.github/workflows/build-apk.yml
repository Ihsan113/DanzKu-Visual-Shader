name: Build DanzKu Monitor APK V5.2.26 UI FIX

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install SDK
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build APK
        working-directory: monitor
        run: gradle :app:assembleDebug --no-daemon

      - name: Verify APK
        run: |
          set -euxo pipefail
          test -s monitor/app/build/outputs/apk/debug/app-debug.apk
          file monitor/app/build/outputs/apk/debug/app-debug.apk
          sha256sum monitor/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DanzKu-Monitor-V5.2.26-debug
          path: monitor/app/build/outputs/apk/debug/app-debug.apk
